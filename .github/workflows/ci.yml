# Run the complete Python, artifact, and browser quality checks on every change.
name: WhyBack quality gate

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whyback-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-static:
    name: Python format, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_NO_PROGRESS: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Synchronize the frozen development environment
        run: uv sync --frozen --extra dev

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python, including security rules
        run: uv run ruff check .

      - name: Type-check Python
        run: uv run pyright

  quality:
    name: Deterministic quality audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_NO_PROGRESS: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install Node.js for the auditable web gate
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Synchronize the frozen development environment
        run: uv sync --frozen --extra dev

      - name: Run the auditable deterministic quality gate
        run: uv run python scripts/run_quality_gate.py --allow-live-skipped

      - name: Upload test and audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whyback-test-audit-${{ github.run_id }}
          path: artifacts/tests/
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web lint, test, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci --ignore-scripts

      - name: Lint web application
        run: npm run lint

      - name: Test web application
        run: npm run test

      - name: Type-check and build web application
        run: npm run build
