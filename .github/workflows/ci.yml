name: WhyBack quality gate

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: whyback-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Deterministic quality audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_FROZEN: "1"
      UV_NO_PROGRESS: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize the frozen development environment
        run: uv sync --frozen --extra dev

      - name: Run the auditable deterministic quality gate
        run: uv run python scripts/run_quality_gate.py --allow-live-skipped

      - name: Upload test and audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whyback-test-audit-${{ github.run_id }}
          path: |
            artifacts/tests/test_audit.json
            artifacts/tests/TEST_AUDIT.md
            artifacts/tests/junit.xml
            artifacts/tests/coverage.json
            artifacts/tests/artifact_verification.json
            artifacts/tests/eval_report.json
            artifacts/tests/EVAL_REPORT.md
          if-no-files-found: warn
          retention-days: 14
