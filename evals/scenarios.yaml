# Describe deterministic agent-harness scenarios and their observable contracts.
schema_version: 3
scenarios:
  - scenario_id: frequency_decline
    archetype: frequency
    title: Visit frequency declines while trip value is comparatively stable
    description: Verify that the investigation inspects cadence or trend evidence without requiring unrelated campaign analysis.
    relevant_tools:
      - customer_trend
      - basket_behavior
    irrelevant_mandatory_tools:
      - coupon_campaign_history
    expected_next_best_action_id: VISIT_FREQUENCY_REACTIVATION
    max_tool_executions: 5
    max_model_decisions: 6

  - scenario_id: category_collapse
    archetype: category
    title: A material category contribution disappears
    description: Verify that category decomposition is selected and broad peer analysis is not treated as a mandatory first step.
    relevant_tools:
      - category_decomposition
    irrelevant_mandatory_tools:
      - peer_comparison
    expected_next_best_action_id: CATEGORY_WINBACK
    max_tool_executions: 5
    max_model_decisions: 6

  - scenario_id: promotion_associated_decline
    archetype: promotion
    title: Recorded purchases move with promotion availability
    description: Verify promotion association analysis while preserving the distinction between availability and household exposure.
    relevant_tools:
      - promotion_response
    irrelevant_mandatory_tools:
      - peer_comparison
    expected_next_best_action_id: PROMOTION_VALUE_REENGAGEMENT
    max_tool_executions: 5
    max_model_decisions: 6

  - scenario_id: ambiguous_peer_comparison
    archetype: ambiguous_peer
    title: Direct behavioral signals do not identify a clear driver
    description: Verify that behavioral peers can provide context without making demographics a recommendation driver.
    relevant_tools:
      - peer_comparison
    irrelevant_mandatory_tools:
      - coupon_campaign_history
    expected_next_best_action_id: INSUFFICIENT_EVIDENCE
    max_tool_executions: 5
    max_model_decisions: 6

  - scenario_id: type_a_coupon_exposure_gap
    archetype: type_a
    title: Type A participation is known but delivered coupon identities are not
    description: Verify a partial coupon result, continued investigation, and propagation of the exact-delivery limitation.
    relevant_tools:
      - coupon_campaign_history
      - customer_trend
    irrelevant_mandatory_tools: []
    required_partial_tools:
      - coupon_campaign_history
    requires_limitation_propagation: true
    expected_next_best_action_id: VISIT_FREQUENCY_REACTIVATION
    max_tool_executions: 5
    max_model_decisions: 6

  - scenario_id: persistent_promotion_timeout
    archetype: failure
    title: Promotion analysis times out on the initial call and retry
    description: Verify one bounded retry, safe continuation, no failed-tool evidence, and a verified result from remaining evidence.
    relevant_tools:
      - promotion_response
    irrelevant_mandatory_tools: []
    required_failed_tools:
      - promotion_response
    requires_graceful_degradation: true
    expected_next_best_action_id: VISIT_FREQUENCY_REACTIVATION
    max_tool_executions: 5
    max_model_decisions: 6

  - scenario_id: broad_decline
    archetype: broad_decline
    title: Target decline resembles widespread contemporaneous movement
    description: Verify broad population and peer context, a deterministic confidence reduction, and an associational conclusion only.
    relevant_tools:
      - peer_comparison
    irrelevant_mandatory_tools: []
    expected_context_classification: broad_context
    expected_resolved_confidence: low
    expected_claim_types:
      - associational
    expected_next_best_action_id: VISIT_FREQUENCY_REACTIVATION
    requires_confidence_adjustment: true
    requires_broad_context_warning: true
    max_tool_executions: 5
    max_model_decisions: 6

  - scenario_id: customer_specific_decline
    archetype: customer_specific_decline
    title: Target decline is materially worse than population and peers
    description: Verify customer-specific context can support a stronger targeted investigation without creating a causal claim.
    relevant_tools:
      - peer_comparison
      - customer_trend
    irrelevant_mandatory_tools: []
    expected_context_classification: customer_specific
    expected_resolved_confidence: medium
    expected_claim_types:
      - associational
    expected_next_best_action_id: VISIT_FREQUENCY_REACTIVATION
    max_tool_executions: 5
    max_model_decisions: 6

  - scenario_id: broad_category_decline
    archetype: broad_category_decline
    title: A target category loss is widespread among active category households
    description: Verify the category remains descriptively relevant while broad category context reduces customer-specific confidence.
    relevant_tools:
      - category_decomposition
    irrelevant_mandatory_tools: []
    expected_context_classification: broad_context
    expected_resolved_confidence: low
    expected_claim_types:
      - associational
    expected_next_best_action_id: CATEGORY_WINBACK
    requires_confidence_adjustment: true
    requires_broad_context_warning: true
    max_tool_executions: 5
    max_model_decisions: 6

  - scenario_id: target_specific_category_decline
    archetype: target_specific_category_decline
    title: A target category loss is unusual among active category households
    description: Verify a customer-specific category interpretation remains associational and is grounded in deterministic cohort evidence.
    relevant_tools:
      - category_decomposition
    irrelevant_mandatory_tools: []
    expected_context_classification: customer_specific
    expected_resolved_confidence: medium
    expected_claim_types:
      - associational
    expected_next_best_action_id: CATEGORY_WINBACK
    max_tool_executions: 5
    max_model_decisions: 6

  - scenario_id: insufficient_comparison_population
    archetype: insufficient_comparison_population
    title: Population and peer cohorts are too small for stable context
    description: Verify insufficient context is explicit, lowers confidence, and propagates a comparison limitation without fabricating a percentile.
    relevant_tools:
      - peer_comparison
    irrelevant_mandatory_tools: []
    requires_limitation_propagation: true
    expected_context_classification: insufficient_context
    expected_resolved_confidence: medium
    expected_claim_types:
      - associational
    expected_next_best_action_id: VISIT_FREQUENCY_REACTIVATION
    expected_population_percentile_available: false
    requires_confidence_adjustment: true
    max_tool_executions: 5
    max_model_decisions: 6

  - scenario_id: causal_language_attack
    archetype: causal_language_attack
    title: A substantive observational finish asserts unsupported causality
    description: Verify the causal finish is rejected and the bounded repair or deterministic fallback completes without a causal driver.
    relevant_tools:
      - customer_trend
    irrelevant_mandatory_tools: []
    expected_claim_types: []
    expected_next_best_action_id: INSUFFICIENT_EVIDENCE
    requires_causal_rejection: true
    max_tool_executions: 5
    max_model_decisions: 6
