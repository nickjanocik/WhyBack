# Define WhyBack's package, locked dependency policy, and Python quality tools.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whyback"
version = "0.1.0"
description = "Evidence-grounded customer retention investigations"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "WhyBack contributors" }]
dependencies = [
  "duckdb>=1.4.0,<2",
  "jinja2>=3.1.5,<4",
  "numpy>=2.1.0,<3",
  "google-genai>=2.3.0,<3",
  "pandas>=2.2.3,<4",
  "pyarrow>=18.0.0,<24",
  "pydantic>=2.10.0,<3",
  "pyreadr>=0.5.3,<1",
  "pyyaml>=6.0.2,<7",
  "rich>=13.9.0,<15",
  "typer>=0.15.0,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120.0,<7",
  "pytest>=8.3.0,<10",
  "pytest-cov>=6.0.0,<8",
  "pytest-timeout>=2.3.0,<3",
  "pyright>=1.1.390,<2",
  "ruff>=0.9.0,<1",
]

[project.scripts]
whyback = "whyback.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/whyback"]

[tool.hatch.build.targets.wheel.force-include]
"configs/actions.yaml" = "whyback/resources/actions.yaml"
"configs/app.toml" = "whyback/resources/app.toml"
"scripts/verify_artifacts.py" = "whyback/_scripts/verify_artifacts.py"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# These subprocesses use internal argument vectors and never invoke a shell.
"scripts/build_demo.py" = ["S603"]
"scripts/run_quality_gate.py" = ["S314", "S603"]
"src/whyback/cli.py" = ["S603"]
# These assertions narrow already-validated application-owned state.
"scripts/verify_artifacts.py" = ["S101"]
"src/whyback/agent/runner.py" = ["S101"]
"src/whyback/methodology.py" = ["S101"]
"src/whyback/reporting/models.py" = ["S101"]
# Source URLs are fixed HTTPS locations with pinned size and SHA-256 checks.
"src/whyback/data/download.py" = ["S310"]
# Dynamic SQL contains escaped paths, allow-listed identifiers, or placeholders.
"src/whyback/data/prepare.py" = ["S607", "S608"]
"src/whyback/data/repository.py" = ["S608"]
"src/whyback/tools/category.py" = ["S608"]
# HTML rendering enables autoescape; Markdown uses explicit escaping filters.
"src/whyback/reporting/render.py" = ["S701"]
# Tests intentionally use assertions for executable specifications.
"tests/**/*.py" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "scripts", "evals"]
exclude = ["artifacts", "data"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
pythonpath = ["."]
timeout = 30
markers = [
  "live: requires network, official prepared data, or an external model",
  "slow: deterministic but unsuitable for the fastest local loop",
]

[tool.coverage.run]
branch = true
source = ["whyback"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
